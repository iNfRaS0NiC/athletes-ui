<!DOCTYPE html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#CA1744; --accent-hi:#E31E52; --accent-dim:rgba(202,23,68,.16);
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
[data-theme="dark"]{
  --bg:#13151A; --surface:#1B1E25; --raised:#22262E;
  --line:#2E333C; --line-soft:#252A32;
  --ink:#E9EBEF; --muted:#949CA8;
  --good:#3BAE81; --flag:#D3A03C; --flag-bg:rgba(211,160,60,.12);
  --alert:#E05B4E; --alert-bg:rgba(224,91,78,.12);
}
[data-theme="light"]{
  --bg:#F2F3F5; --surface:#FFFFFF; --raised:#F7F8F9;
  --line:#D9DDE2; --line-soft:#E9ECEF;
  --ink:#171A1F; --muted:#68707C;
  --good:#1E7A58; --flag:#8A6008; --flag-bg:#FBF3E0;
  --alert:#A62F25; --alert-bg:#FBECEA;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}

header{display:flex;align-items:center;gap:14px;padding:12px 18px;
  background:var(--surface);border-bottom:1px solid var(--line)}
header img{height:19px;width:auto;display:block}
header .sep{width:1px;height:20px;background:var(--line)}
header h1{margin:0;font:600 14px/1 var(--sans);letter-spacing:-.01em}
header .spacer{flex:1}
.theme{background:none;border:1px solid var(--line);color:var(--muted);
  width:auto;margin:0;padding:5px 11px;font:500 11px var(--sans);
  border-radius:3px;cursor:pointer;letter-spacing:.02em}
.theme:hover{color:var(--ink);border-color:var(--accent)}

.wrap{display:grid;grid-template-columns:336px minmax(0,1fr);gap:14px;
  padding:14px;align-items:start}
@media(max-width:780px){.wrap{grid-template-columns:1fr}}

.panel{background:var(--surface);border:1px solid var(--line);
  border-radius:5px;padding:16px}
label{display:block;font:500 12px var(--sans);margin:0 0 5px;color:var(--ink)}
.hint{font:400 11px var(--sans);color:var(--muted);margin:4px 0 0}
textarea,input,select{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:4px;background:var(--bg);color:var(--ink);
  font:400 12.5px/1.45 var(--mono)}
textarea{min-height:88px;resize:vertical}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.65}
select{font-family:var(--sans);font-size:13px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px var(--accent-dim)}
.field{margin-bottom:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

fieldset{border:0;border-top:1px solid var(--line-soft);margin:15px 0 0;padding:12px 0 0}
legend{padding:0;font:600 10.5px var(--sans);color:var(--muted);letter-spacing:.04em}
.check{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px;
  font:400 12.5px var(--sans)}
.check input{margin:2px 0 0;width:auto;flex:none;accent-color:var(--accent);
  box-shadow:none}
.check span{display:block;font-size:11px;color:var(--muted);margin-top:1px}

#run{width:100%;margin-top:16px;padding:10px;border-radius:4px;cursor:pointer;
  background:var(--accent);color:#fff;border:0;
  font:600 13.5px var(--sans);letter-spacing:.01em}
#run:hover:not(:disabled){background:var(--accent-hi)}
#run:disabled{opacity:.5;cursor:progress}
#run.done{background:var(--good)}
.status{display:flex;align-items:center;gap:8px;font:500 12px var(--sans);
  color:var(--good);margin-top:10px}
.status.busy{color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;
  flex:none;display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{height:2px;background:var(--line-soft);border-radius:2px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

#out>*+*{margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:40px 8px;font-size:13px}
h2{font:600 10.5px var(--sans);letter-spacing:.04em;color:var(--muted);margin:0 0 10px}

.ledger{display:grid;grid-template-columns:repeat(2,1fr);margin:0;row-gap:16px}
@media(min-width:700px){.ledger{grid-template-columns:repeat(4,1fr)}}
.ledger div{padding:1px 14px;border-left:2px solid var(--line);min-width:0}
.ledger div:first-child{border-left-color:var(--accent)}
.ledger div.hit{border-left-color:var(--alert)}
.ledger div.warn{border-left-color:var(--flag)}
.ledger dt{font:500 11px var(--sans);color:var(--muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ledger dd{margin:4px 0 0;font:500 26px/1 var(--mono);letter-spacing:-.02em}
.ledger dd.ok{color:var(--good)}
.ledger dd.bad{color:var(--alert)}
.ledger dd.warn{color:var(--flag)}

.sources{display:flex;flex-wrap:wrap;gap:0 22px;margin-top:16px;
  padding-top:13px;border-top:1px solid var(--line-soft)}
.sources span{font:400 11.5px var(--sans);color:var(--muted)}
.sources b{font:500 12.5px var(--mono);color:var(--ink);margin-left:5px}

pre{margin:0;padding:12px;border-radius:4px;background:var(--raised);
  border:1px solid var(--line-soft);font:400 11.5px/1.65 var(--mono);
  white-space:pre-wrap;color:var(--ink)}
.note{border-left:2px solid var(--flag);background:var(--flag-bg);
  padding:10px 13px;border-radius:0 4px 4px 0;font-size:12.5px}
.note+.note{margin-top:7px}
.note.bad{border-left-color:var(--alert);background:var(--alert-bg)}
.note b{font-weight:600}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <img id="logo" alt="Enetpulse">
  <span class="sep"></span>
  <h1>Athlete extractor</h1>
  <span class="spacer"></span>
  <button class="theme" id="theme" type="button">Light</button>
</header>
<div class="wrap">
<form class="panel" id="form">
  <div class="field">
    <label for="pages">Wikipedia links</label>
    <textarea id="pages" placeholder="https://en.wikipedia.org/wiki/2025_World_Boxing_Championships"></textarea>
    <p class="hint">One per line. Paste the address bar as it is.</p>
  </div>
  <div class="row">
    <div class="field">
      <label for="sport">Sport</label>
      <input type="text" id="sport" placeholder="boxing">
    </div>
    <div class="field">
      <label for="gender">Gender</label>
      <select id="gender">
        <option value="">Read from the page</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>
  </div>
  <fieldset>
    <legend>WHERE TO LOOK</legend>
    <label class="check"><input type="checkbox" id="wikitext" checked>
      <div>Page source<span>Squad and medal templates.</span></div></label>
    <label class="check"><input type="checkbox" id="sweep" checked>
      <div>Wikidata sweep<span>Every athlete linked from the page.</span></div></label>
    <label class="check"><input type="checkbox" id="enrich" checked>
      <div>Fill dates of birth<span>For athletes who have an article.</span></div></label>
    <label class="check"><input type="checkbox" id="html" checked>
      <div>Rendered tables<span>Hand-written result tables, including athletes with no article.</span></div></label>
  </fieldset>
  <fieldset>
    <legend>COLUMNS TO FILL</legend>
    <label class="check"><input type="checkbox" id="includeDob" checked><div>DOB</div></label>
    <label class="check"><input type="checkbox" id="includePosition"><div>Position</div></label>
  </fieldset>
  <button id="run" type="submit">Extract athletes</button>
  <div class="bar"><i id="bar"></i></div>
  <div class="status" id="status" style="display:none"><i></i><span></span></div>
</form>
<section id="out"><div class="panel empty">Paste a link to start.</div></section>
</div>

var $ = function (id) { return document.getElementById(id); };

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function panel(title, inner){
  return '<div class="panel">' + (title ? '<h2>' + title + '</h2>' : '') + inner + '</div>';
}
function cell(label, value, cls){
  return '<div><dt>' + label + '</dt><dd class="' + (cls||'') + '">' + value + '</dd></div>';
}

function applyTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  $('logo').src = mode === 'dark' ? WM_DARK : WM_LIGHT;
  $('theme').textContent = mode === 'dark' ? 'Light' : 'Dark';
  try { localStorage.setItem('theme', mode); } catch (e) {}
}
var startMode = 'dark';
try { startMode = localStorage.getItem('theme') || 'dark'; } catch (e) {}
applyTheme(startMode);
$('theme').addEventListener('click', function(){
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

var state = {};

function options(){
  return {
    sport: $('sport').value.trim(),
    gender: $('gender').value,
    wikitext: $('wikitext').checked,
    sweep: $('sweep').checked,
    enrich: $('enrich').checked,
    html: $('html').checked,
    includeDob: $('includeDob').checked,
    includePosition: $('includePosition').checked,
    requireSport: true
  };
}

function gap(label, value, severity){
  // country and gender block an upload; a missing date only weakens the row
  var cls = value ? severity : 'ok';
  var edge = value ? (severity === 'bad' ? ' class="hit"' : ' class="warn"') : '';
  return '<div' + edge + '><dt>' + label + '</dt>' +
    '<dd class="' + cls + '">' + value + '</dd></div>';
}

function render(){
  var t = state.totals, out = [];
  out.push(panel('',
    '<dl class="ledger">' +
      '<div><dt>Athletes</dt><dd class="ok">' + t.total + '</dd></div>' +
      gap('No country', t.missingCountry, 'bad') +
      gap('No gender', t.missingGender, 'bad') +
      gap('No date of birth', t.missingDob, 'warn') +
    '</dl>' +
    '<div class="sources">' +
      '<span>Page source<b>' + t.fromWikitext + '</b></span>' +
      '<span>Wikidata<b>' + t.fromWikidata + '</b></span>' +
      '<span>Rendered tables<b>' + t.fromHtml + '</b></span>' +
      (t.duplicates ? '<span>Duplicates skipped<b>' + t.duplicates + '</b></span>' : '') +
    '</div>'));

  if (state.gaps.length){
    out.push(panel('POSSIBLY INCOMPLETE',
      state.gaps.map(function(g){
        return '<div class="note bad">' + esc(g) + '</div>';
      }).join('')));
  }

  var keys = Object.keys(state.blanks);
  if (keys.length){
    out.push(panel('COUNTRY LEFT BLANK - DECIDE MANUALLY',
      keys.map(function(k){
        var b = state.blanks[k];
        return '<div class="note"><b>' + esc(k) + '</b> &mdash; ' + b.count +
          ' row' + (b.count > 1 ? 's' : '') + '<br>' + esc(b.reason) + '</div>';
      }).join('')));
  }
  out.push(panel('WHAT IT DID', '<pre>' + esc(state.log.join('\n')) + '</pre>'));
  $('out').innerHTML = out.join('');
}

function setStatus(text, busy){
  var box = $('status');
  if (!text) { box.style.display = 'none'; return; }
  box.style.display = 'flex';
  box.className = busy ? 'status busy' : 'status';
  box.lastChild.textContent = text;
}

function finish(){
  setStatus('Writing to the sheet', true);
  google.script.run
    .withSuccessHandler(function(written){
      state.log.push('');
      state.log.push('Wrote ' + written + ' rows to the tab "' + state.sheet + '".');
      render();
      $('bar').style.width = '100%';
      $('run').disabled = false;
      $('run').textContent = 'Extract athletes';
      setStatus('Done - ' + written + ' rows in "' + state.sheet + '"', false);
    })
    .withFailureHandler(function(err){
      state.log.push('Could not finish: ' + err.message);
      render();
      $('run').disabled = false;
      $('run').textContent = 'Extract athletes';
      setStatus('Stopped: ' + err.message, false);
    })
    .finishJob(state.sheet);
}

function step(index){
  if (index >= state.pages.length) { finish(); return; }
  $('bar').style.width = Math.round(index / state.pages.length * 100) + '%';
  setStatus('Page ' + (index + 1) + ' of ' + state.pages.length, true);
  google.script.run
    .withSuccessHandler(function(res){
      var t = state.totals;
      t.total += res.total; t.fromWikitext += res.fromWikitext;
      t.fromWikidata += res.fromWikidata; t.fromHtml += res.fromHtml || 0;
      t.missingDob += res.missingDob; t.missingGender += res.missingGender;
      t.missingCountry += res.missingCountry || 0;
      t.stated += res.stated || 0;
      for (var k in res.blanks){
        if (!state.blanks[k]) state.blanks[k] = {count: 0, reason: res.blanks[k].reason};
        state.blanks[k].count += res.blanks[k].count;
      }
      t.duplicates += res.duplicates || 0;
      state.log.push(res.title);
      state.log.push('  ' + res.total + ' athletes: ' + res.fromWikitext +
        ' from the page source, ' + res.fromWikidata + ' more from Wikidata');
      if (res.fromHtml) {
        state.log.push('  ' + res.fromHtml + ' more from the rendered tables');
      }
      if (res.filledCountries) {
        state.log.push('  ' + res.filledCountries + ' countries read off the page');
      }
      if (res.stated) {
        state.log.push('  page states ' + res.stated + ' competitors -> ' +
          res.coverage + '% coverage');
        if (res.coverage < 80) {
          state.gaps.push(res.title + ': ' + res.total + ' of ' + res.stated +
            ' competitors (' + res.coverage + '%). The missing ones are most ' +
            'likely athletes with no Wikipedia article.');
        }
      }
      if (res.duplicates) {
        state.log.push('  ' + res.duplicates + ' already on the sheet, skipped' +
          (res.enriched ? ' (' + res.enriched + ' gaps filled in)' : ''));
      }
      if (!res.total) state.log.push('  nothing found - try a sub-page for a single event');
      render();
      step(index + 1);
    })
    .withFailureHandler(function(err){
      state.log.push(state.pages[index] + ' failed: ' + err.message);
      render();
      step(index + 1);
    })
    .processPage(state.sheet, state.pages[index], options());
}

function complain(message, focus){
  $('out').innerHTML = panel('', '<div class="note bad">' + esc(message) + '</div>');
  if (focus) $(focus).focus();
}

$('form').addEventListener('submit', function(e){
  e.preventDefault();
  var pages = $('pages').value.split('\n').filter(function(x){ return x.trim(); });
  if (!pages.length){
    complain('Paste at least one Wikipedia link.', 'pages');
    return;
  }
  if (!$('sport').value.trim()){
    complain('Type the sport first - it goes into the Sport column and cannot '
      + 'be filled in afterwards without editing every row.', 'sport');
    return;
  }
  $('run').disabled = true; $('run').textContent = 'Working...';
  setStatus('Starting', true);
  $('out').innerHTML = panel('', '<p class="empty">Reading the pages and asking Wikidata.</p>');
  google.script.run
    .withSuccessHandler(function(sheetName){
      state = {sheet: sheetName, pages: pages, log: [], blanks: {}, gaps: [],
        totals: {total: 0, fromWikitext: 0, fromWikidata: 0, fromHtml: 0,
                 missingCountry: 0, missingDob: 0, missingGender: 0,
                 duplicates: 0, stated: 0}};
      step(0);
    })
    .withFailureHandler(function(err){
      $('out').innerHTML = panel('', '<div class="note bad">' + esc(err.message) + '</div>');
      $('run').disabled = false; $('run').textContent = 'Extract athletes';
      setStatus('Stopped: ' + err.message, false);
    })
    .startJob(options());
});
</script>
